<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Geolocation Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Main Container - Optimized for Desktop -->
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col gap-6">
        
        <!-- Header -->
        <div class="text-center md:text-left border-b border-slate-800/80 pb-4">
            <h1 class="text-2xl font-bold tracking-tight text-white">Geolocation Finder</h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1">Fetch your current geographic coordinates and system specifications</p>
        </div>

        <!-- Desktop Grid Layout (Left: Controls/Stats, Right: Map) -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Controls & Stats (5 cols) -->
            <div class="md:col-span-5 flex flex-col gap-5">
                
                <!-- System Details Cards (OS & Browser) -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between">
                        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">OS</span>
                        <span id="osVal" class="text-xs font-mono font-semibold text-indigo-400 mt-1 truncate">Detecting...</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between">
                        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Browser</span>
                        <span id="browserVal" class="text-xs font-mono font-semibold text-indigo-400 mt-1 truncate">Detecting...</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="getLocationBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition font-medium text-sm py-3 px-4 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Get My Location
                </button>

                <!-- Status / Error Banner -->
                <div id="statusMessage" class="hidden text-xs px-3 py-2 rounded-lg text-center font-medium"></div>

                <!-- Telemetry Cards (Lat, Long, Accuracy) -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between">
                        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Latitude</span>
                        <span id="latVal" class="text-sm font-mono font-semibold text-emerald-400 mt-1 truncate">--</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between">
                        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Longitude</span>
                        <span id="lonVal" class="text-sm font-mono font-semibold text-emerald-400 mt-1 truncate">--</span>
                    </div>
                    <div class="col-span-2 bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between">
                        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Accuracy Radius</span>
                        <span id="accVal" class="text-sm font-mono font-semibold text-sky-400 mt-1">--</span>
                    </div>
                </div>

            </div>

            <!-- Right Column: Large Desktop Map View (7 cols) -->
            <div class="md:col-span-7 flex flex-col gap-2 h-full">
                <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Map Preview</span>
                <div class="w-full h-72 md:h-[312px] bg-slate-950 rounded-xl border border-slate-800 overflow-hidden relative flex items-center justify-center">
                    <iframe id="mapFrame" class="w-full h-full border-0 hidden" loading="lazy"></iframe>
                    <div id="mapPlaceholder" class="text-xs text-slate-500 font-medium text-center px-4">
                        Map preview will load here after fetching your location
                    </div>
                </div>
                <div id="mapLinkContainer" class="hidden text-right">
                    <a id="externalMapLink" href="#" target="_blank" class="text-xs text-emerald-400 hover:underline inline-flex items-center gap-1 font-medium">
                        Open larger in OpenStreetMap &rarr;
                    </a>
                </div>
            </div>

        </div>

    </div>

    <!-- Script Logic -->
    <script>
        const getBtn = document.getElementById('getLocationBtn');
        const statusMsg = document.getElementById('statusMessage');
        const latVal = document.getElementById('latVal');
        const lonVal = document.getElementById('lonVal');
        const accVal = document.getElementById('accVal');
        const osVal = document.getElementById('osVal');
        const browserVal = document.getElementById('browserVal');
        const mapFrame = document.getElementById('mapFrame');
        const mapPlaceholder = document.getElementById('mapPlaceholder');
        const mapLinkContainer = document.getElementById('mapLinkContainer');
        const externalMapLink = document.getElementById('externalMapLink');

        async function detectSystemInfo() {
            let osName = "Unknown OS";
            let browserName = "Unknown Browser";
            const ua = navigator.userAgent;

            if (navigator.userAgentData) {
                try {
                    const uaData = await navigator.userAgentData.getHighEntropyValues(["platform", "platformVersion"]);
                    if (uaData.platform === "Windows") {
                        const majorVer = parseInt(uaData.platformVersion.split('.')[0], 10);
                        osName = majorVer >= 13 ? "Windows 11" : "Windows 10";
                    } else {
                        osName = uaData.platform;
                    }
                } catch (e) {
                    osName = fallbackGetOS(ua);
                }
            } else {
                osName = fallbackGetOS(ua);
            }

            if (ua.includes("Edg/")) {
                const match = ua.match(/Edg\/([0-9.]+)/);
                browserName = `Edge ${match ? match[1].split('.')[0] : ''}`;
            } else if (ua.includes("Chrome/")) {
                const match = ua.match(/Chrome\/([0-9.]+)/);
                browserName = `Chrome ${match ? match[1].split('.')[0] : ''}`;
            } else if (ua.includes("Firefox/")) {
                const match = ua.match(/Firefox\/([0-9.]+)/);
                browserName = `Firefox ${match ? match[1].split('.')[0] : ''}`;
            } else if (ua.includes("Safari/") && !ua.includes("Chrome")) {
                const match = ua.match(/Version\/([0-9.]+)/);
                browserName = `Safari ${match ? match[1].split('.')[0] : ''}`;
            } else if (ua.includes("OPR/") || ua.includes("Opera/")) {
                const match = ua.match(/(?:OPR|Opera)\/([0-9.]+)/);
                browserName = `Opera ${match ? match[1].split('.')[0] : ''}`;
            }

            osVal.textContent = osName;
            browserVal.textContent = browserName;
        }

        function fallbackGetOS(ua) {
            if (ua.includes("Win")) {
                return ua.includes("Windows NT 10.0") ? "Windows 10/11" : "Windows";
            } else if (ua.includes("Mac")) return "macOS";
            else if (ua.includes("Android")) return "Android";
            else if (ua.includes("like Mac") || ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
            else if (ua.includes("Linux")) return "Linux";
            return "Unknown OS";
        }

        detectSystemInfo();

        function showStatus(text, type = 'info') {
            statusMsg.textContent = text;
            statusMsg.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border', 'border-red-900', 'bg-sky-950/80', 'text-sky-300', 'border-sky-900');
            
            if (type === 'error') {
                statusMsg.classList.add('bg-red-950/80', 'text-red-300', 'border', 'border-red-900');
            } else {
                statusMsg.classList.add('bg-sky-950/80', 'text-sky-300', 'border', 'border-sky-900');
            }
        }

        function clearStatus() {
            statusMsg.classList.add('hidden');
        }

        getBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showStatus('Geolocation is not supported by your browser', 'error');
                return;
            }

            showStatus('Acquiring location fix...');
            getBtn.disabled = true;
            getBtn.classList.add('opacity-50', 'cursor-not-allowed');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    clearStatus();
                    getBtn.disabled = false;
                    getBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    latVal.textContent = lat.toFixed(6);
                    lonVal.textContent = lon.toFixed(6);
                    accVal.textContent = `${Math.round(accuracy)} meters`;

                    const delta = 0.005;
                    const bbox = `${lon - delta},${lat - delta},${lon + delta},${lat + delta}`;
                    mapFrame.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lon}`;
                    mapFrame.classList.remove('hidden');
                    mapPlaceholder.classList.add('hidden');

                    externalMapLink.href = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}`;
                    mapLinkContainer.classList.remove('hidden');
                },
                (error) => {
                    getBtn.disabled = false;
                    getBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            showStatus('Location permission denied in browser settings.', 'error');
                            break;
                        case error.POSITION_UNAVAILABLE:
                            showStatus('Location information is unavailable.', 'error');
                            break;
                        case error.TIMEOUT:
                            showStatus('The request to get user location timed out.', 'error');
                            break;
                        default:
                            showStatus('An unknown error occurred.', 'error');
                            break;
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
